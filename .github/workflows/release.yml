name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-gems:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  release:
    if: github.repository == 'kpumuk/envameleon' && github.ref == 'refs/heads/main'
    name: Verify and publish gem release
    needs: build-gems
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release

    permissions:
      attestations: write # Required to publish build provenance.
      contents: write # Required to create the GitHub release and tag.
      id-token: write # Required by provenance and RubyGems trusted publishing.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Update apt index
        run: sudo apt-get update
      - name: Install binutils
        run: sudo apt-get install --yes --no-install-recommends binutils
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gem-*
          path: pkg
          merge-multiple: true
      - name: Verify release metadata, gems, binaries, and checksums
        run: ruby .github/scripts/release_metadata.rb
      - name: Attest gem build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pkg/*.gem
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish platform gems, then source fallback gem
        run: ruby .github/scripts/publish_gems.rb pkg
      - name: Create GitHub release with checksums and gems
        run: gh release create "$RELEASE_TAG" pkg/*.gem SHA256SUMS --target "$GITHUB_SHA" --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
