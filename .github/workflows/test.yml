name: test

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@b5bde6c7a0b283ceea37e041c11bff155343a0c6
    with:
      min_version: 3.2
      engine: cruby

  test:
    name: Test ${{ matrix.os }} / Ruby ${{ matrix.ruby }}
    needs: ruby-versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ${{ fromJson(needs.ruby-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Configure extension
        run: ruby -Cext/envameleon extconf.rb
      - name: Compile extension
        run: make -C ext/envameleon
      - name: Run tests
        run: ruby -Ilib -Iext test/test_envameleon.rb
      - name: Run privileged Linux tests
        if: runner.os == 'Linux'
        run: sudo env "PATH=$PATH" ruby -Ilib -Iext test/test_envameleon.rb
      - name: Build gem
        run: gem build envameleon.gemspec
